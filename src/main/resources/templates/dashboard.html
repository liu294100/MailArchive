<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<div class="container">
    <div class="row mb-4">
        <div class="col-md-12">
            <h2>仪表盘</h2>
        </div>
    </div>

    <div class="row">
        <!-- 统计卡片 -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">活跃邮箱</h5>
                    <p class="card-text display-4" id="active-mailboxes">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">今日归档邮件</h5>
                    <p class="card-text display-4" id="today-emails">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">总归档邮件</h5>
                    <p class="card-text display-4" id="total-emails">0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <!-- 最近归档邮件列表 -->
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">最近归档邮件</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>主题</th>
                                    <th>发件人</th>
                                    <th>接收时间</th>
                                    <th>附件</th>
                                </tr>
                            </thead>
                            <tbody id="recent-emails">
                                <!-- 动态加载数据 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
