<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mailbox Configuration</title>
    <!-- Include common CSS -->
    <th:block th:replace="common/head :: head-content"></th:block>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav th:replace="common/sidebar :: sidebar-nav"></nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Mailbox Configuration</h1>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#mailboxModal" id="add-mailbox-btn">
                        <i class="fas fa-plus"></i> Add New Mailbox
                    </button>
                </div>

                <!-- Mailbox List Table -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="mailbox-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Email</th>
                                <th>Host</th>
                                <th>Protocol</th>
                                <th>SSL</th>
                                <th>Active</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data populated by JavaScript or Thymeleaf -->
                            <tr th:each="mailbox : ${mailboxes}" th:data-id="${mailbox.id}">
                                <td th:text="${mailbox.id}"></td>
                                <td th:text="${mailbox.email}"></td>
                                <td th:text="${mailbox.host}"></td>
                                <td th:text="${mailbox.protocol}"></td>
                                <td>
                                    <span th:if="${mailbox.ssl}" class="badge bg-info">Yes</span>
                                    <span th:unless="${mailbox.ssl}" class="badge bg-secondary">No</span>
                                </td>
                                <td>
                                    <span th:if="${mailbox.active}" class="badge bg-success">Active</span>
                                    <span th:unless="${mailbox.active}" class="badge bg-secondary">Inactive</span>
                                </td>
                                <td th:text="${mailbox.description}"></td>
                                <td>
                                    <button type="button" class="btn btn-sm btn-info edit-btn" th:data-id="${mailbox.id}" data-bs-toggle="modal" data-bs-target="#mailboxModal">
                                        <i class="fas fa-edit"></i> Edit
                                    </button>
                                    <button type="button" class="btn btn-sm btn-danger delete-btn" th:data-id="${mailbox.id}">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(mailboxes)}">
                                <td colspan="8" class="text-center">No mailbox configurations found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>

    <!-- Mailbox Add/Edit Modal -->
    <div class="modal fade" id="mailboxModal" tabindex="-1" aria-labelledby="mailboxModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="mailboxModalLabel">Add/Edit Mailbox</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="mailboxForm">
                        <input type="hidden" id="configId" name="id">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="col-md-6">
                                <label for="username" class="form-label">Username (Login)</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                           <div class="col-md-6">
                                <label for="password" class="form-label">Password/App Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="col-md-6">
                                <label for="protocol" class="form-label">Protocol</label>
                                <select class="form-select" id="protocol" name="protocol" required>
                                    <option value="imap">IMAP</option>
                                    <option value="pop3">POP3</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label for="host" class="form-label">Server Host</label>
                                <input type="text" class="form-control" id="host" name="host" required>
                            </div>
                             <div class="col-md-4">
                                <label for="port" class="form-label">Port</label>
                                <input type="number" class="form-control" id="port" name="port" required>
                            </div>
                        </div>
                         <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="ssl" name="ssl">
                                    <label class="form-check-label" for="ssl">Use SSL</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="active" name="active" checked>
                                    <label class="form-check-label" for="active">Is Active</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description (Optional)</label>
                            <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveMailboxBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Include common JS -->
    <div th:replace="common/scripts :: scripts"></div>
    <!-- Add specific JS for this page if needed -->
    <script>
        // Basic JS to handle modal opening for adding
        document.getElementById('add-mailbox-btn').addEventListener('click', function() {
            document.getElementById('mailboxForm').reset(); // Clear form
            document.getElementById('configId').value = ''; // Clear ID for adding
            document.getElementById('mailboxModalLabel').textContent = 'Add New Mailbox';
        });

        // Add event listeners for edit/delete/save buttons (to be implemented in app.js or here)
        // Example: 
        // document.querySelectorAll('.edit-btn').forEach(button => { ... });
        // document.querySelectorAll('.delete-btn').forEach(button => { ... });
        // document.getElementById('saveMailboxBtn').addEventListener('click', function() { ... });
    </script>
</body>
</html>
